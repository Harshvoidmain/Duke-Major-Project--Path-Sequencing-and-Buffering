<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#25364a"/>
    </marker>
    <style>
      .box { fill:#d9edf8; stroke:#25364a; stroke-width:2.5; rx:16; }
      .decision { fill:#fff3c4; stroke:#25364a; stroke-width:2.5; }
      .terminal { fill:#b8e0cb; stroke:#25364a; stroke-width:2.5; }
      .line { fill:none; stroke:#25364a; stroke-width:2.5; marker-end:url(#arrow); }
      .loop { fill:none; stroke:#2878a7; stroke-width:3; marker-end:url(#arrow); }
      .text { font-family:Arial,Helvetica,sans-serif; font-size:22px; fill:#172536; text-anchor:middle; }
      .small { font-family:Arial,Helvetica,sans-serif; font-size:19px; fill:#172536; text-anchor:middle; }
      .label { font-family:Arial,Helvetica,sans-serif; font-size:19px; font-weight:bold; fill:#2878a7; }
      .note { font-family:Arial,Helvetica,sans-serif; font-size:18px; font-style:italic; fill:#2878a7; text-anchor:middle; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="white"/>

  <!-- Column setup -->
  <rect class="terminal" x="40" y="30" width="210" height="60" rx="30"/>
  <text class="text" x="145" y="68">Start</text>

  <rect class="box" x="315" y="20" width="300" height="80"/>
  <text class="small" x="465" y="52">Read filtered hits</text>
  <text class="small" x="465" y="77">and group by event/wedge</text>

  <rect class="box" x="680" y="20" width="280" height="80"/>
  <text class="small" x="820" y="52">Sort each layer</text>
  <text class="small" x="820" y="77">by increasing z</text>

  <polygon class="decision" points="1105,10 1260,60 1105,110 950,60"/>
  <text class="small" x="1105" y="53">At least 16 hits</text>
  <text class="small" x="1105" y="77">on every layer?</text>

  <rect class="box" x="1295" y="20" width="265" height="80"/>
  <text class="small" x="1427" y="52">Select Layer 1 SP</text>
  <text class="small" x="1427" y="77">Start a column</text>

  <path class="line" d="M250 60 H315"/>
  <path class="line" d="M615 60 H680"/>
  <path class="line" d="M960 60 H950"/>
  <path class="line" d="M1260 60 H1295"/>
  <text class="label" x="1270" y="48">Yes</text>

  <path class="line" d="M1105 110 V145 H820 V180"/>
  <text class="label" x="1120" y="140">No</text>
  <rect class="terminal" x="685" y="180" width="270" height="60" rx="30"/>
  <text class="small" x="820" y="217">Next event / wedge</text>

  <!-- Patch construction -->
  <rect class="box" x="1295" y="150" width="265" height="75"/>
  <text class="small" x="1427" y="181">Select Layer 4 SP</text>
  <text class="small" x="1427" y="206">at row target</text>

  <rect class="box" x="955" y="150" width="280" height="75"/>
  <text class="small" x="1095" y="181">Right-justify Layer 2</text>
  <text class="small" x="1095" y="206">and Layer 3 SPs</text>

  <rect class="box" x="615" y="150" width="280" height="75"/>
  <text class="small" x="755" y="181">Create Layer 1–4</text>
  <text class="small" x="755" y="206">parameter-space rectangle</text>

  <rect class="box" x="275" y="150" width="280" height="75"/>
  <text class="small" x="415" y="181">Clip with Layer 2 and 3</text>
  <text class="small" x="415" y="206">minimum/maximum strips</text>

  <path class="line" d="M1427 100 V150"/>
  <path class="line" d="M1295 188 H1235"/>
  <path class="line" d="M955 188 H895"/>
  <path class="line" d="M615 188 H555"/>

  <polygon class="decision" points="415,265 565,320 415,375 265,320"/>
  <text class="small" x="415" y="313">Valid polygon with</text>
  <text class="small" x="415" y="338">nonzero area?</text>
  <path class="line" d="M415 225 V265"/>

  <rect class="box" x="625" y="280" width="270" height="80"/>
  <text class="small" x="760" y="312">Write 64 selected hits</text>
  <text class="small" x="760" y="337">and all polygon corners</text>
  <path class="line" d="M565 320 H625"/>
  <text class="label" x="580" y="307">Yes</text>

  <polygon class="decision" points="1080,265 1230,320 1080,375 930,320"/>
  <text class="small" x="1080" y="313">Is the seed patch</text>
  <text class="small" x="1080" y="338">a full rectangle?</text>
  <path class="line" d="M895 320 H930"/>

  <!-- Same-column path -->
  <rect class="box" x="1235" y="430" width="325" height="85"/>
  <text class="small" x="1397" y="462">Keep the same Layer 1 SP</text>
  <text class="small" x="1397" y="489">row target = Layer 4 z min</text>
  <path class="line" d="M1150 355 V400 H1397 V430"/>
  <text class="label" x="1180" y="392">Yes</text>
  <path class="loop" d="M1560 472 H1580 V188 H1560"/>
  <text class="note" x="1395" y="545">Continue downward in the same column</text>

  <!-- Next-column path -->
  <rect class="box" x="715" y="430" width="350" height="85"/>
  <text class="small" x="890" y="462">Save the nonrectangular seed</text>
  <text class="small" x="890" y="489">column target = Layer 1 z min</text>
  <path class="line" d="M1010 355 V430"/>
  <text class="label" x="1025" y="400">No</text>
  <path class="loop" d="M715 472 H665 V125 H1427 V150"/>
  <text class="note" x="890" y="545">Move left and restart from the top</text>

  <!-- Invalid-polygon path -->
  <rect class="box" x="60" y="430" width="350" height="85"/>
  <text class="small" x="235" y="462">Save nothing for this trial</text>
  <text class="small" x="235" y="489">Move to the next column</text>
  <path class="line" d="M315 355 V430"/>
  <text class="label" x="330" y="400">No</text>
  <path class="loop" d="M60 472 H30 V125 H1427 V150"/>

  <!-- End conditions -->
  <rect class="terminal" x="585" y="640" width="430" height="70" rx="35"/>
  <text class="small" x="800" y="670">End when another Layer 1</text>
  <text class="small" x="800" y="695">superpoint cannot be selected</text>

  <path class="line" d="M1427 225 V250 H1510 V590 H800 V640"/>
  <text class="small" x="1465" y="575">Layer 4 selection fails:</text>
  <text class="small" x="1465" y="599">finish current column</text>

  <text class="note" x="800" y="600">Outer loop changes Layer 1 columns; inner loop changes Layer 4 patches</text>
</svg>
