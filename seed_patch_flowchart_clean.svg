<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="820" viewBox="0 0 1800 820"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#33465b"/></marker><style>text{font-family:Arial,sans-serif;fill:#203449;text-anchor:middle;font-size:23px}.box{fill:#dceefa;stroke:#33465b;stroke-width:2}.line{fill:none;stroke:#33465b;stroke-width:2.5;marker-end:url(#a)}.label{font-size:20px;font-weight:bold;fill:#2377a6}</style></defs><rect width="1800" height="820" fill="white"/><text x="290" y="35" class="label">1. Prepare the wedge</text><text x="875" y="35" class="label">2. Form one seed patch</text><text x="1480" y="35" class="label">3. Decide the next position</text><path d="M580 65V745 M1170 65V745" stroke="#dbe4ec" stroke-width="2" stroke-dasharray="6 8"/><rect class="box" x="160" y="65" width="260" height="48" rx="12" style="fill:#b8e0cb"/><text x="290" y="97" class="">Start</text><path class="line" d="M290 113V140"/><rect class="box" x="90" y="140" width="400" height="74" rx="12" /><text x="290" y="171" class="">Read filtered wedge hits</text><text x="290" y="199" class="">Group by event and wedge</text><path class="line" d="M290 214V245"/><rect class="box" x="90" y="245" width="400" height="66" rx="12" /><text x="290" y="286" class="">Sort each layer by increasing z</text><path class="line" d="M290 311V350"/><polygon points="290,350 495,410 290,470 85,410" fill="#fff1c5" stroke="#33465b" stroke-width="2"/><text x="290" y="404" class="">At least 16 hits</text><text x="290" y="432" class="">on every layer?</text><path class="line" d="M85 410H35V713H90"/><text x="57" y="392" class="label">No</text><rect class="box" x="90" y="689" width="400" height="48" rx="12" style="fill:#b8e0cb"/><text x="290" y="721" class="">Skip this event / wedge</text><path class="line" d="M290 470V587"/><text x="317" y="578" class="label">Yes</text><rect class="box" x="90" y="587" width="400" height="82" rx="12" /><text x="290" 